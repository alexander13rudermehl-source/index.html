name: Sync client error reports

# Firebase-правила errorReports публичны на чтение (см. debug-panel в
# index.html, который туда пишет), поэтому авторизация не нужна — просто
# скачиваем снапшот и коммитим его в репозиторий. Claude не имеет прямого
# сетевого доступа к Firebase из песочницы, зато читает файлы репозитория —
# так этот workflow становится мостом между живой базой и ревью ошибок.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch errorReports snapshot
        run: |
          mkdir -p admin-logs
          curl -sS -f -o admin-logs/error-reports.json \
            "https://zolotaya-kletka-default-rtdb.firebaseio.com/errorReports.json?print=pretty"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin-logs/error-reports.json
          git diff --cached --quiet || git commit -m "Синхронизация лога ошибок клиента"
          git push
